[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b2cq"
version = "0.1.2"
description = "Web app that batch-quantizes Mistral/Mistral3 models on RunPod GPU pods."
readme = "README.md"
requires-python = "==3.10.*"
license = {text = "MIT"}
authors = [{name = "BigBlueCeiling"}]
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "sse-starlette==2.1.*",
    "huggingface_hub==0.36.*",
    "transformers==4.57.*",
    "accelerate==1.12.*",
    "datasets==4.6.*",  # llmcompressor 0.10 requires >=4.0,<=4.6
    "python-multipart==0.0.20",
    "jinja2==3.1.*",
    "pydantic==2.9.*",
    # EXACT pin -- FrndoBrain-class calibration is version-locked to the
    # serving stack; see SPEC.md §14 for the attribute-drift hard-fail
    # rationale. Do not loosen without re-auditing the pin per §14.
    "mistral-common==1.11.5",
    # torch installed separately in Dockerfile to pick up CUDA 12.8 wheel
    # llm-compressor installed separately (may need extra index)
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.*",
    "pytest-asyncio==0.24.*",
    "httpx==0.27.*",  # for FastAPI test client
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
